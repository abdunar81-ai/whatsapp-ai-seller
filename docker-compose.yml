services:
  # WhatsApp session lives here. NOWEB engine = no browser, fits a 2 GB server.
  waha:
    image: devlikeapro/waha
    ports:
      - "127.0.0.1:3001:3000"   # only reachable from the server itself
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WHATSAPP_HOOK_URL: http://bot:3000/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message
    volumes:
      - ./waha-sessions:/app/.sessions   # keeps the WhatsApp login across restarts
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      WHATSAPP_PROVIDER: waha
      WAHA_URL: http://waha:3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data   # script.md + bot.db (chats, leads, stats, settings)
    depends_on:
      - waha
    restart: unless-stopped

  # HTTPS for the admin panel at https://$DOMAIN
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bot
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
