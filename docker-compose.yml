services:
  bot:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./auth:/app/auth   # Baileys WhatsApp session (keeps you linked across restarts)
      - ./data:/app/data   # products.json + orders.json
    restart: unless-stopped

  # Only needed when WHATSAPP_PROVIDER=waha:  docker compose --profile waha up
  waha:
    profiles: ["waha"]
    image: devlikeapro/waha
    ports:
      - "3001:3000"
    environment:
      WHATSAPP_HOOK_URL: http://bot:3000/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message
      WAHA_API_KEY: ${WAHA_API_KEY:-}
    volumes:
      - ./waha-sessions:/app/.sessions
    restart: unless-stopped
