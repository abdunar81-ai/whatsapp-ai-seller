services:
  # WhatsApp session lives here. NOWEB engine = no browser, fits a 2 GB server.
  waha:
    image: devlikeapro/waha:noweb-2026.10.1   # pinned; the NOWEB build has no Chrome (~1 GB smaller)
    ports:
      - "127.0.0.1:3001:3000"   # only reachable from the server itself
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WHATSAPP_HOOK_URL: http://bot:3000/webhooks/waha
      # message.any also brings messages a manager sends from the phone, so the bot knows to stay quiet
      WHATSAPP_HOOK_EVENTS: message,message.any
    volumes:
      - ./waha-sessions:/app/.sessions   # keeps the WhatsApp login across restarts
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      WHATSAPP_PROVIDER: waha
      WAHA_URL: http://waha:3000
      WHISPER_URL: http://whisper:9000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data   # script.md + bot.db (chats, leads, stats, settings)
    depends_on:
      - waha
      - whisper
    restart: unless-stopped

  # Speech-to-text for voice notes (Kazakh + Russian). "small" fits a 2 GB server;
  # the model unloads after 10 idle minutes to free memory.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.11.0   # pinned; v2 changed things, upgrade on purpose
    environment:
      ASR_MODEL: small
      ASR_ENGINE: faster_whisper
      MODEL_IDLE_TIMEOUT: 600
    volumes:
      - whisper-cache:/root/.cache
    restart: unless-stopped

  # HTTPS for the admin panel at https://$DOMAIN
  caddy:
    image: caddy:2.11.9-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bot
    restart: unless-stopped

volumes:
  whisper-cache:
  caddy-data:
  caddy-config:
